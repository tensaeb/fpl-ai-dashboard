<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05030b" />
  <title>You're Offline — FPL//AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: #05030b;
      color: #f2edff;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(139, 92, 246, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, 0.055) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 30%, transparent 78%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: linear-gradient(160deg, rgba(27, 18, 54, 0.72), rgba(13, 8, 28, 0.86));
      border: 1px solid rgba(148, 120, 255, 0.14);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 90vw;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-badge {
      width: 32px; height: 32px;
      background: #00ff87;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #032117;
      box-shadow: 0 0 24px -4px rgba(0, 255, 135, 0.45);
    }

    .logo-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #f2edff;
    }

    .logo-text span { color: #00ff87; }

    .signal-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(233, 0, 82, 0.12);
      border: 1px solid rgba(233, 0, 82, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .signal-icon svg { width: 28px; height: 28px; color: #e90052; }

    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f2edff;
      margin-bottom: 12px;
    }

    p {
      font-size: 13px;
      line-height: 1.7;
      color: #8e86b0;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: #00ff87;
      color: #032117;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: filter 0.2s;
    }

    .btn:hover { filter: brightness(1.1); }

    .note {
      margin-top: 20px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #5c5478;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-badge">∫</div>
      <span class="logo-text">FPL<span>//</span>AI</span>
    </div>

    <div class="signal-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.83M8.11 8.11A5.01 5.01 0 006 12a6 6 0 001.757 4.243M10.27 4.273A8.99 8.99 0 0112 4c4.97 0 9 4.03 9 9a8.99 8.99 0 01-1.43 4.9" />
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>
      FPL//AI needs a connection to pull live squad data and generate briefs.
      Check your signal and try again.
    </p>
    <button class="btn" onclick="window.location.reload()">Try again</button>
    <p class="note">Cached pages load instantly when back online</p>
  </div>
</body>
</html>
